<!doctype html>
<html lang="en" data-theme="dark">
    <head>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Research Annotations — User Login"
        />
        <title>Research Annotations — Login</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />

        <link rel="stylesheet" href="/style/variables.css" />
        <link rel="stylesheet" href="/style/login.css" />
    </head>
    <body>
        <div class="login_container">
            <div class="login_card">
                <div class="login_header">
                    <div class="login_logo_badge">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <h1 class="login_title">Research Annotations</h1>
                    <p class="login_subtitle">Sign in to your account</p>
                </div>

                <div id="login-error" class="login_alert" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="login-error-text"></span>
                </div>

                <form id="login-form" class="login_form" novalidate>
                    <div class="form_group">
                        <label for="username" class="form_label">Login</label>
                        <div class="input_wrapper">
                            <i class="input_icon fa-solid fa-user"></i>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="form_input"
                                placeholder="Enter your login"
                                autocomplete="username"
                                required
                            />
                        </div>
                    </div>

                    <div class="form_group">
                        <label for="password" class="form_label">Password</label>
                        <div class="input_wrapper">
                            <i class="input_icon fa-solid fa-lock"></i>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form_input form_input--password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            />
                            <button
                                type="button"
                                id="password-toggle"
                                class="password_toggle_btn"
                                aria-label="Toggle password visibility"
                            >
                                <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="login_submit_btn">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>
            </div>
        </div>

        <script type="module" src="/js/login.js"></script>
    </body>
</html>
