<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Research Annotations — Table management interface"
        />
        <title>Research Annotations</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/code@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/embed@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/@editorjs/image@latest"></script>

        <link rel="stylesheet" href="/style/variables.css" />
        <link rel="stylesheet" href="/style/sidebar.css" />
        <link rel="stylesheet" href="/style/tables_details.css" />
        <link rel="stylesheet" href="/style/annotation_modal.css" />
        <link rel="stylesheet" href="/style/home.css" />
    </head>
    <body>
        <div id="layout" class="layout">
            <aside class="sidebar">
                <button
                    id="sidebar-toggle"
                    class="sidebar_toggle"
                    aria-label="Collapse sidebar"
                >
                    <i class="fa-solid fa-angles-left"></i>
                </button>

                <div class="sidebar_heading">
                    <h2>Tables</h2>
                    <button id="sidebar-add-table" aria-label="Add table">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <div id="sidebar-tables"></div>
            </aside>

            <div id="sidebar-resize" class="sidebar_resize"></div>

            <main class="main">
                <div class="main_topbar">
                    <button
                        id="main-toggle"
                        class="main_toggle"
                        aria-label="Expand sidebar"
                    >
                        <i class="fa-solid fa-angles-right"></i>
                    </button>

                    <button class="main_settings" aria-label="Settings">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <div class="table_header_container">
                    <h1 id="table-title" class="table-title">Table Title</h1>
                </div>

                <div class="table_wrapper">
                    <table class="data-table">
                        <thead id="table-details-head"></thead>
                        <tbody id="table-details-body"></tbody>
                    </table>
                </div>
            </main>
        </div>

        <script type="module" src="/js/home.js"></script>
    </body>
</html>
