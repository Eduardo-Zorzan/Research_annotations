<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Research Annotations — Table management interface">
    <title>Research Annotations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/style/variables.css">
    <link rel="stylesheet" href="/style/home.css">

<body>

<div id="layout" class="layout">

    <aside class="sidebar">
        <button id="sidebar-toggle" class="sidebar_toggle" aria-label="Collapse sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
                <polyline points="15 8 12 12 15 16"/>
            </svg>
        </button>

        <h2 class="sidebar_heading">Tables</h2>

        <button class="sidebar_btn active">Table 1</button>
        <button class="sidebar_btn">Table 2</button>
        <button class="sidebar_btn">Table 3</button>
    </aside>

    <main class="main">
        <div class="main_topbar">
            <button id="main-toggle" class="main_toggle" aria-label="Expand sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                    <polyline points="13 8 16 12 13 16"/>
                </svg>
            </button>

            <button class="main_settings" aria-label="Settings">

                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>

                             a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                             A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68

                             a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                             a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>

        <h1 class="table-title">Table Title</h1>

        <table class="data-table">
            <thead>
                <tr>
                    <th></th>
                    <th></th>
                    <th></th>

            <tbody>
                <tr>
                    <td></td>
                    <td></td>

                <tr>
                    <td></td>

                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>

            </tbody>
        </table>

</div>

<script src="/js/home.js"></script>

</body>
</html>
